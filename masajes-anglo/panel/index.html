<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel masajes · Global Safety Day</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@700&display=swap" rel="stylesheet">
<style>
:root{--marino:#2A4A8A;--teal:#446CB4;--borde:#DCE3EF;--fondo:#F5F7FB;--suave:#5E6675;--ambar:#FFF3D6;--ambar-t:#7A5200}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:var(--fondo);color:#1E2D3A;font-size:14px}
.top{background:var(--marino);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:'Raleway';font-size:17px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.login{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:24px}
.login h2{font-family:'Raleway';color:var(--marino);margin-bottom:12px}
input,select{padding:10px;border:1px solid var(--borde);border-radius:8px;font:inherit;font-size:15px;width:100%}
button{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
button.sec{background:#fff;color:var(--marino);border:1px solid var(--borde)}
.err{color:#B3261E;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px;color:var(--marino)}
.stat span{color:var(--suave);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar select,.bar input{width:auto;flex:1;min-width:160px}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--borde);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:9px 10px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
th{background:#EDF2FA;font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0}
tr.eval td{background:var(--ambar)}
.tag{display:inline-block;background:#FCE3B0;color:var(--ambar-t);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.chk{width:20px;height:20px;accent-color:var(--teal)}
.hidden{display:none}
small{color:var(--suave)}
#acciones{display:flex;gap:8px}
#acciones.hidden{display:none}
.acc{display:flex;flex-direction:column;gap:6px}
.acc button{padding:6px 10px;font-size:13px}
button.del{background:#fff;color:#B3261E;border:1px solid #E7B9B5}
.modal{position:fixed;inset:0;background:rgba(0,20,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:10}
.modal.hidden{display:none}
.caja{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:560px}
.caja h3{font-family:'Raleway';color:var(--marino);margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.campo{margin-bottom:10px}
.campo label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
.botones{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<div class="top"><h1>Masaje en silla · Global Safety Day 28-oct</h1><div id="acciones" class="hidden"><button class="sec" id="recargar">Actualizar</button><button id="pdf">Descargar PDF</button></div></div>

<div class="login" id="login">
  <h2>Acceso equipo</h2>
  <input type="password" id="clave" placeholder="Clave del panel" autocomplete="current-password">
  <button style="width:100%;margin-top:10px" id="entrar">Entrar</button>
  <p class="err" id="err"></p>
</div>

<div class="wrap hidden" id="app">
  <div class="stats" id="stats"></div>
  <div class="bar">
    <select id="fSede"><option value="">Todas las sedes</option><option>Edificio Titanium</option><option>Faena El Soldado</option></select>
    <input id="fTxt" placeholder="Buscar nombre o RUT">
    <label style="display:flex;align-items:center;gap:6px;white-space:nowrap"><input type="checkbox" id="fEval" class="chk" style="width:18px">Solo a evaluar</label>
  </div>
  <div class="tbl"><table>
    <thead><tr><th>Asistió</th><th>Sede · Hora</th><th>Persona</th><th>Anamnesis</th><th>Molestia</th><th>Presión</th><th>Obs.</th><th></th></tr></thead>
    <tbody id="filas"></tbody>
  </table></div>
</div>

<div class="modal hidden" id="mEditar" role="dialog" aria-modal="true" aria-labelledby="tEditar">
  <div class="caja">
    <h3 id="tEditar">Editar inscripción</h3>
    <div class="g2">
      <div class="campo"><label for="eSede">Sede</label><select id="eSede"><option>Edificio Titanium</option><option>Faena El Soldado</option></select></div>
      <div class="campo"><label for="eHora">Horario</label><select id="eHora"></select></div>
    </div>
    <div class="campo"><label for="eNombre">Nombre completo</label><input id="eNombre"></div>
    <div class="g2">
      <div class="campo"><label for="eRut">RUT</label><input id="eRut"></div>
      <div class="campo"><label for="eEdad">Edad</label><input id="eEdad" type="number" min="16" max="99"></div>
      <div class="campo"><label for="eTel">Teléfono</label><input id="eTel" type="tel"></div>
      <div class="campo"><label for="eEmail">Correo</label><input id="eEmail" type="email"></div>
    </div>
    <div class="campo"><label for="eArea">Área o cargo</label><input id="eArea"></div>
    <div class="campo"><label for="eMed">Medicamentos</label><input id="eMed"></div>
    <div class="campo"><label for="eObs">Observaciones</label><input id="eObs"></div>
    <p class="err" id="eErr"></p>
    <div class="botones"><button class="sec" data-cerrar>Cancelar</button><button id="eGuardar">Guardar cambios</button></div>
  </div>
</div>

<div class="modal hidden" id="mBorrar" role="dialog" aria-modal="true" aria-labelledby="tBorrar">
  <div class="caja">
    <h3 id="tBorrar">Eliminar inscripción</h3>
    <p id="bTexto"></p>
    <p class="err" id="bErr"></p>
    <div class="botones"><button class="sec" data-cerrar>Cancelar</button><button class="del" id="bConfirmar" style="background:#B3261E;color:#fff;border:0">Sí, eliminar</button></div>
  </div>
</div>

<script>
const SB_URL='https://dnlvzwrujosuckdzmffx.supabase.co', SB_KEY='sb_publishable_fv9R8pVxgaHyxABGebYXOQ_aw_3f6RZ';
const $=id=>document.getElementById(id);
let clave='', datos=[];
const rpc=async(fn,body)=>{const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.message||'Error');return j;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtRut=r=>r?r.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+r.slice(-1):'';

async function cargar(){
  datos=await rpc('masajes_anglo_panel',{p_clave:clave});
  pintar();
}
$('entrar').onclick=async()=>{
  clave=$('clave').value; $('err').textContent='';
  try{await cargar(); try{sessionStorage.setItem('mk',clave)}catch(e){}
    $('login').classList.add('hidden');$('app').classList.remove('hidden');$('acciones').classList.remove('hidden');}
  catch(e){$('err').textContent='Clave incorrecta.';}
};
$('clave').onkeydown=e=>{if(e.key==='Enter')$('entrar').click()};
try{const k=sessionStorage.getItem('mk');if(k){$('clave').value=k;$('entrar').click();}}catch(e){}

function pintar(){
  const s=$('fSede').value, t=$('fTxt').value.toLowerCase(), ev=$('fEval').checked;
  const lista=datos.filter(d=>(!s||d.sede===s)&&(!ev||d.requiere_evaluacion)&&(!t||d.nombre.toLowerCase().includes(t)||d.rut.toLowerCase().includes(t.replace(/[^0-9k]/g,''))));
  const n=f=>datos.filter(f).length;
  $('stats').innerHTML=[
    ['Inscritos',datos.length],['Edificio Titanium',n(d=>d.sede==='Edificio Titanium')],['Faena El Soldado',n(d=>d.sede==='Faena El Soldado')],
    ['A evaluar',n(d=>d.requiere_evaluacion)],['Atendidos',n(d=>d.asistio)]
  ].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('filas').innerHTML=lista.map(d=>`<tr class="${d.requiere_evaluacion?'eval':''}">
    <td><input type="checkbox" class="chk" data-id="${d.id}" ${d.asistio?'checked':''}></td>
    <td><b>${d.hora.slice(0,5)}</b><br><small>${esc(d.sede)}</small></td>
    <td><b>${esc(d.nombre)}</b><br><small>${fmtRut(d.rut)} · ${d.edad??''} años<br>${esc(d.telefono)}${d.area?'<br>'+esc(d.area):''}</small></td>
    <td>${d.requiere_evaluacion?'<span class="tag">EVALUAR</span><br>':''}${esc(d.condiciones.join(', '))}${d.medicamentos?'<br><small>Med: '+esc(d.medicamentos)+'</small>':''}</td>
    <td>${esc(d.zonas_molestia.join(', '))}<br><small>Dolor ${d.dolor??0}/10</small></td>
    <td>${esc(d.presion)}</td><td>${esc(d.observaciones)}</td>
    <td><div class="acc"><button class="sec" data-edit="${d.id}">Editar</button><button class="del" data-del="${d.id}">Eliminar</button></div></td></tr>`).join('')||'<tr><td colspan="8"><small>Sin inscripciones.</small></td></tr>';
}
['fSede','fTxt','fEval'].forEach(id=>$(id).addEventListener('input',pintar));
$('recargar').onclick=()=>cargar();
$('filas').addEventListener('change',async e=>{
  if(!e.target.dataset.id)return;
  try{await rpc('masajes_anglo_marcar_asistencia',{p_clave:clave,p_id:e.target.dataset.id,p_asistio:e.target.checked});
    datos.find(d=>d.id===e.target.dataset.id).asistio=e.target.checked;pintar();}
  catch(err){alert('No se pudo guardar');e.target.checked=!e.target.checked;}
});
let actual=null, dispo=[];
const abrir=id=>$(id).classList.remove('hidden'), cerrar=()=>document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden'));
document.querySelectorAll('[data-cerrar]').forEach(b=>b.onclick=cerrar);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)cerrar()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});
function llenarHoras(){
  const sede=$('eSede').value, propia=actual&&actual.sede===sede?actual.hora.slice(0,5):null;
  $('eHora').innerHTML=dispo.filter(b=>b.sede===sede).map(b=>{
    const h=b.hora.slice(0,5), libres=b.cupo-b.ocupados+(h===propia?1:0);
    return `<option value="${h}" ${libres<=0?'disabled':''} ${h===propia?'selected':''}>${h} · ${libres<=0?'lleno':libres+(libres===1?' libre':' libres')}</option>`;
  }).join('');
}
$('eSede').onchange=llenarHoras;
$('filas').addEventListener('click',async e=>{
  const ed=e.target.closest('[data-edit]'), del=e.target.closest('[data-del]');
  if(ed){
    actual=datos.find(d=>d.id===ed.dataset.edit); $('eErr').textContent='';
    $('eSede').value=actual.sede; $('eNombre').value=actual.nombre; $('eRut').value=fmtRut(actual.rut);
    $('eEdad').value=actual.edad??''; $('eTel').value=actual.telefono??''; $('eEmail').value=actual.email??'';
    $('eArea').value=actual.area??''; $('eMed').value=actual.medicamentos??''; $('eObs').value=actual.observaciones??'';
    $('eHora').innerHTML='<option>Cargando…</option>'; abrir('mEditar');
    try{dispo=await rpc('masajes_anglo_disponibilidad',{}); llenarHoras();}catch(err){$('eErr').textContent='No se pudieron cargar los horarios.';}
  }
  if(del){
    actual=datos.find(d=>d.id===del.dataset.del); $('bErr').textContent='';
    $('bTexto').innerHTML=`¿Eliminar a <b>${esc(actual.nombre)}</b> (${esc(actual.sede)}, ${actual.hora.slice(0,5)} hrs)? Se libera su cupo y no se puede deshacer.`;
    abrir('mBorrar');
  }
});
$('eGuardar').onclick=async()=>{
  const b=$('eGuardar'); b.disabled=true; $('eErr').textContent='';
  try{
    const r=await rpc('masajes_anglo_editar',{p_clave:clave,p_id:actual.id,p:{sede:$('eSede').value,hora:$('eHora').value,nombre:$('eNombre').value,rut:$('eRut').value,edad:$('eEdad').value,telefono:$('eTel').value,email:$('eEmail').value,area:$('eArea').value,medicamentos:$('eMed').value,observaciones:$('eObs').value}});
    if(!r.ok){$('eErr').textContent=r.error;return;}
    cerrar(); await cargar();
  }catch(err){$('eErr').textContent='No se pudo guardar. Revisa tu conexión.';}
  finally{b.disabled=false;}
};
$('bConfirmar').onclick=async()=>{
  const b=$('bConfirmar'); b.disabled=true;
  try{await rpc('masajes_anglo_eliminar',{p_clave:clave,p_id:actual.id}); cerrar(); await cargar();}
  catch(err){$('bErr').textContent='No se pudo eliminar. Revisa tu conexión.';}
  finally{b.disabled=false;}
};
const cargarScript=src=>new Promise((ok,mal)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>mal(new Error('No se pudo cargar '+src));document.head.appendChild(s);});
let libsPdf=null;
const asegurarLibsPdf=()=>libsPdf||(libsPdf=cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  .then(()=>cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
  .catch(e=>{libsPdf=null;throw e;}));
function filtrados(){
  const s=$('fSede').value, t=$('fTxt').value.toLowerCase(), ev=$('fEval').checked;
  return datos.filter(d=>(!s||d.sede===s)&&(!ev||d.requiere_evaluacion)&&(!t||d.nombre.toLowerCase().includes(t)||d.rut.toLowerCase().includes(t.replace(/[^0-9k]/g,''))))
    .sort((x,y)=>x.sede.localeCompare(y.sede)||x.hora.localeCompare(y.hora)||x.nombre.localeCompare(y.nombre));
}
$('pdf').onclick=async()=>{
  const btn=$('pdf'), txt=btn.textContent; btn.disabled=true; btn.textContent='Generando PDF…';
  try{
    await asegurarLibsPdf();
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const lista=filtrados(), sede=$('fSede').value;
    const filtros=[sede||'Todas las sedes', $('fEval').checked?'solo a evaluar':'', $('fTxt').value?('búsqueda: "'+$('fTxt').value+'"'):''].filter(Boolean).join(' · ');
    const ahora=new Date().toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'});
    const W=doc.internal.pageSize.getWidth();
    doc.setFillColor(42,74,138); doc.rect(0,0,W,22,'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text('Masaje en silla · Global Safety Day 28-oct',12,10);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text(filtros+'   |   Generado: '+ahora,12,17);
    doc.text('SGTRUMAO SpA',W-12,10,{align:'right'});
    const n=f=>lista.filter(f).length;
    const resumen=[['Inscritos',lista.length],['Edificio Titanium',n(d=>d.sede==='Edificio Titanium')],['Faena El Soldado',n(d=>d.sede==='Faena El Soldado')],['A evaluar',n(d=>d.requiere_evaluacion)],['Atendidos',n(d=>d.asistio)]];
    doc.setTextColor(30,45,58); let x=12;
    resumen.forEach(([l,v])=>{doc.setDrawColor(220,227,239);doc.roundedRect(x,26,52,13,2,2,'S');doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(String(v),x+4,33);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(94,102,117);doc.text(l,x+4,37);doc.setTextColor(30,45,58);x+=55;});
    const filas=lista.map(d=>[
      d.asistio?'Sí':'',
      d.hora.slice(0,5)+'\n'+(d.sede==='Edificio Titanium'?'Titanium':d.sede==='Faena El Soldado'?'El Soldado':d.sede),
      d.nombre+'\n'+fmtRut(d.rut)+(d.edad!=null?' · '+d.edad+' años':''),
      [d.telefono,d.area].filter(Boolean).join('\n'),
      (d.requiere_evaluacion?'EVALUAR\n':'')+((d.condiciones||[]).join(', ')||'Ninguna')+(d.medicamentos?'\nMed: '+d.medicamentos:''),
      ((d.zonas_molestia||[]).join(', ')||'-')+'\nDolor '+(d.dolor??0)+'/10',
      d.presion||'',
      d.observaciones||''
    ]);
    doc.autoTable({
      startY:43, head:[['Asistió','Hora · Sede','Persona','Contacto · Área','Anamnesis','Molestia','Presión','Obs.']], body:filas,
      theme:'grid', margin:{left:12,right:12,bottom:14},
      styles:{font:'helvetica',fontSize:8.5,cellPadding:2,valign:'top',lineColor:[220,227,239],lineWidth:0.2,textColor:[30,45,58],overflow:'linebreak'},
      headStyles:{fillColor:[237,242,250],textColor:[94,102,117],fontStyle:'bold',fontSize:8},
      columnStyles:{0:{cellWidth:15,halign:'center'},1:{cellWidth:22},2:{cellWidth:50},3:{cellWidth:36},4:{cellWidth:58},5:{cellWidth:44},6:{cellWidth:18},7:{cellWidth:'auto'}},
      didParseCell:h=>{ if(h.section!=='body')return; const d=lista[h.row.index];
        if(d&&d.requiere_evaluacion) h.cell.styles.fillColor=[255,243,214];
        if(h.column.index===2) h.cell.styles.fontStyle='normal';
      },
      didDrawCell:h=>{ if(h.section!=='body'||h.column.index!==0)return;
        const d=lista[h.row.index]; if(d&&!d.asistio){doc.setDrawColor(150);doc.rect(h.cell.x+h.cell.width/2-2.2,h.cell.y+2,4.4,4.4,'S');}
      },
      didDrawPage:()=>{const H=doc.internal.pageSize.getHeight();doc.setFontSize(8);doc.setTextColor(120);
        doc.text('Documento con datos de salud: uso exclusivo del equipo SGTRUMAO. No reenviar.',12,H-7);
        doc.text('Página '+doc.internal.getNumberOfPages(),W-12,H-7,{align:'right'});}
    });
    if(!lista.length){doc.setFontSize(11);doc.text('Sin inscripciones para los filtros seleccionados.',12,52);}
    const slug=(sede||'todas').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-');
    doc.save('masajes_anglo_28oct_'+slug+'.pdf');
  }catch(e){alert('No se pudo generar el PDF. Revisa tu conexión e inténtalo de nuevo.');}
  finally{btn.disabled=false;btn.textContent=txt;}
};
</script>
</body>
</html>
